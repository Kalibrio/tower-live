<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Tower</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #63b8ff; touch-action: none; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #hud {
      position: fixed; inset: 0; pointer-events: none; overflow: hidden;
      font-family: "Arial Rounded MT Bold", "Avenir Next", "Segoe UI", system-ui, sans-serif;
      color: #fff; user-select: none; -webkit-user-select: none;
    }
    #stars {
      position: absolute; top: max(16px, env(safe-area-inset-top)); left: 0; right: 0;
      display: flex; justify-content: center; align-items: center; gap: 10px;
    }
    .star {
      width: 34px; height: 34px; border-radius: 50%; background: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #cfd4dc; box-shadow: 0 2px 8px rgba(30,60,120,.18);
      transition: color .2s, transform .2s;
    }
    .star:last-child { width: 48px; height: 48px; font-size: 30px; }
    .star.lit { color: #d428d4; transform: scale(1.08); }
    #score {
      position: absolute; top: 74px; left: 0; right: 0;
      text-align: center; font-size: 46px; font-weight: 800; letter-spacing: .01em;
      text-shadow: 0 3px 14px rgba(30, 60, 120, .35);
    }
    #height-warning {
      position: absolute; top: 132px; left: 0; right: 0; text-align: center;
      font-size: 19px; font-weight: 800; color: #ff4d4d; opacity: 0;
      transition: opacity .2s; text-shadow: 0 2px 8px rgba(120,20,20,.4);
    }
    #cooldown {
      position: absolute; bottom: max(26px, env(safe-area-inset-bottom)); left: 50%;
      width: 130px; height: 9px; margin-left: -65px;
      background: rgba(255,255,255,.5); border-radius: 5px; overflow: hidden;
      box-shadow: 0 2px 6px rgba(30,60,120,.2);
    }
    #cooldown-fill { height: 100%; width: 100%; background: #ffc93c; border-radius: 5px; }
    #popups { position: absolute; inset: 0; }
    .pop {
      position: absolute; transform: translate(-50%, -50%);
      font-weight: 800; white-space: nowrap;
      animation: pop-float 1.1s ease-out forwards;
    }
    .pop-score { font-size: 26px; color: #ffc93c; text-shadow: 0 2px 6px rgba(120,70,10,.45); }
    .pop-combo { font-size: 40px; color: #fff; text-shadow: 0 3px 10px rgba(30,60,120,.45); rotate: -7deg; }
    .pop-combo b { color: #ffc93c; }
    .pop-gold { font-size: 30px; color: #ffe066; text-shadow: 0 2px 8px rgba(120,70,10,.55); }
    .pop-level { font-size: 44px; color: #fff; text-shadow: 0 3px 12px rgba(120,30,120,.5); }
    @keyframes pop-float {
      0% { opacity: 0; margin-top: 8px; scale: .6; }
      15% { opacity: 1; scale: 1.15; }
      30% { scale: 1; }
      75% { opacity: 1; }
      100% { opacity: 0; margin-top: -52px; }
    }
    #gameover {
      position: absolute; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: rgba(20, 40, 80, .55); pointer-events: auto;
    }
    #gameover h1 { margin: 0; font-size: 52px; font-weight: 900; letter-spacing: .04em; text-shadow: 0 3px 14px rgba(20,40,80,.5); }
    #gameover p { margin: 0; font-size: 22px; opacity: .95; }
    #gameover button {
      pointer-events: auto; cursor: pointer; border: 0; border-radius: 16px;
      padding: 15px 46px; font-size: 23px; font-weight: 800;
      font-family: inherit; color: #3a2c00; background: #ffc93c;
      box-shadow: 0 6px 0 #cf9a1f, 0 10px 24px rgba(30,60,120,.3);
    }
    #gameover button:active { transform: translateY(3px); box-shadow: 0 3px 0 #cf9a1f; }
  </style>
  <script type="module" crossorigin src="/assets/index-BPIz61jv.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <div id="stars">
      <div class="star">★</div><div class="star">★</div><div class="star">★</div><div class="star">★</div><div class="star">★</div>
    </div>
    <div id="score">0</div>
    <div id="height-warning">TOWER TOO HIGH!</div>
    <div id="popups"></div>
    <div id="cooldown"><div id="cooldown-fill"></div></div>
    <div id="gameover">
      <h1>GAME OVER</h1>
      <p>The tower reached the top</p>
      <p id="final-score"></p>
      <button id="restart">PLAY AGAIN</button>
    </div>
  </div>
</body>
</html>
